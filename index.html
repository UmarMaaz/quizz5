<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1c1c1c; --sub:#6b6b6b;
  --accent:#0f5132; --accent2:#8a6d00; --line:#e4e1da; --danger:#8a1f11; --good:#0f5132bb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161512; --card:#1f1e1a; --ink:#f0efe9; --sub:#a9a69d; --line:#33322c;
  }
}
:root[data-theme="dark"]{--bg:#161512;--card:#1f1e1a;--ink:#f0efe9;--sub:#a9a69d;--line:#33322c;}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Georgia','Times New Roman',serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100%;
}
.wrap{max-width:720px;margin:0 auto;padding:24px 18px 60px;}
header{text-align:center;margin-bottom:20px;}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:.3px;}
.sub{color:var(--sub);font-size:.85rem;font-family:system-ui,sans-serif;}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;}
.section-picker{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px;}
.chip{
  font-family:system-ui,sans-serif;font-size:.8rem;padding:7px 13px;border-radius:20px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.progress-row{display:flex;justify-content:space-between;align-items:center;font-family:system-ui,sans-serif;font-size:.8rem;color:var(--sub);margin-bottom:10px;}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px;}
.bar-fill{height:100%;background:var(--accent);transition:width .25s;}
.qtag{font-family:system-ui,sans-serif;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent2);margin-bottom:8px;}
.qtext{font-size:1.15rem;line-height:1.5;margin-bottom:18px;}
.opt{
  display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;
  border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);
  font-family:system-ui,sans-serif;font-size:.95rem;cursor:pointer;
}
.opt:hover{border-color:var(--accent);}
.opt.correct{background:#0f513222;border-color:var(--accent);}
.opt.wrong{background:#8a1f1122;border-color:var(--danger);}
.opt[disabled]{cursor:default;}
.explain{
  margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--bg);
  border:1px dashed var(--line);font-family:system-ui,sans-serif;font-size:.88rem;line-height:1.5;color:var(--sub);
}
.explain b{color:var(--ink);}
.nav-row{display:flex;justify-content:space-between;margin-top:18px;gap:10px;font-family:system-ui,sans-serif;}
button.nav{
  flex:1;padding:11px;border-radius:8px;border:none;background:var(--accent);color:#fff;
  font-size:.9rem;cursor:pointer;
}
button.nav.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
button.nav:disabled{opacity:.4;cursor:default;}
.score-screen{text-align:center;}
.score-num{font-size:3rem;margin:10px 0;color:var(--accent);font-family:system-ui,sans-serif;font-weight:700;}
.start-screen p{font-family:system-ui,sans-serif;color:var(--sub);font-size:.9rem;line-height:1.6;}
footer{text-align:center;font-family:system-ui,sans-serif;font-size:.72rem;color:var(--sub);margin-top:20px;}
</style>
</head>

const QUESTIONS = [{"section": "Pakistan Affairs (Dates & Years)", "q": "The Nehru Report, proposing a constitutional framework rejected by the Muslim League, was presented in:", "opts": ["1927", "1928", "1930", "1935"], "ans": 1, "exp": "The Nehru Report was presented in 1928."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The Simon Commission, which visited India to review constitutional reforms, arrived in:", "opts": ["1927", "1928", "1930", "1932"], "ans": 1, "exp": "The Simon Commission arrived in India in 1928, facing widespread boycotts."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The Government of India Act of 1919 (Montagu-Chelmsford Reforms) was passed in:", "opts": ["1909", "1919", "1927", "1935"], "ans": 1, "exp": "The Government of India Act 1919 introduced the Montagu-Chelmsford Reforms."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The Minto-Morley Reforms, introducing separate electorates for Muslims, were enacted in:", "opts": ["1905", "1909", "1919", "1935"], "ans": 1, "exp": "The Minto-Morley Reforms (Indian Councils Act) were enacted in 1909."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The partition of Bengal, a significant colonial-era event, occurred in:", "opts": ["1900", "1905", "1911", "1919"], "ans": 1, "exp": "Bengal was partitioned by Lord Curzon in 1905."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The annulment of the Partition of Bengal occurred in:", "opts": ["1905", "1909", "1911", "1915"], "ans": 2, "exp": "The Partition of Bengal was annulled in 1911."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The Jallianwala Bagh Massacre occurred in:", "opts": ["1915", "1919", "1922", "1930"], "ans": 1, "exp": "The Jallianwala Bagh Massacre occurred on 13 April 1919 in Amritsar."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The Khilafat Movement, in which Muslims protested the treatment of the Ottoman Caliphate, was most active during:", "opts": ["1915-1918", "1919-1924", "1930-1935", "1940-1945"], "ans": 1, "exp": "The Khilafat Movement was most active from 1919 to 1924."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The Non-Cooperation Movement, led by Gandhi in conjunction with the Khilafat Movement, was launched in:", "opts": ["1919", "1920", "1922", "1925"], "ans": 1, "exp": "The Non-Cooperation Movement was launched in 1920."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The Chauri Chaura incident, leading to the suspension of the Non-Cooperation Movement, occurred in:", "opts": ["1920", "1922", "1924", "1930"], "ans": 1, "exp": "The Chauri Chaura incident occurred in February 1922."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The Civil Disobedience Movement, including the Salt March, was launched in:", "opts": ["1928", "1930", "1932", "1935"], "ans": 1, "exp": "The Civil Disobedience Movement, including the Dandi Salt March, began in 1930."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The Poona Pact, concerning representation for depressed classes, was signed in:", "opts": ["1930", "1932", "1935", "1937"], "ans": 1, "exp": "The Poona Pact was signed in 1932 between Gandhi and Ambedkar."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The Government of India Act 1935, a key pre-independence constitutional document, received royal assent in:", "opts": ["1932", "1935", "1937", "1940"], "ans": 1, "exp": "The Government of India Act received royal assent in 1935."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "All-India Muslim League's Lucknow Pact with Congress, agreeing on separate electorates, was signed in:", "opts": ["1909", "1916", "1920", "1928"], "ans": 1, "exp": "The Lucknow Pact was signed in 1916."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The founding of the All India Muslim Students Federation occurred in:", "opts": ["1930", "1935", "1937", "1940"], "ans": 2, "exp": "The All India Muslim Students Federation was founded in 1937."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "Fazl-i-Husain's Unionist Party dominated Punjab politics primarily during:", "opts": ["1920s-1930s", "1940s", "1950s", "1960s"], "ans": 0, "exp": "The Unionist Party dominated Punjab politics through the 1920s and 1930s."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The death of Quaid-e-Azam's close associate and Pakistan's first Finance Minister, considerations of early cabinet formations occurred around:", "opts": ["1947", "1950", "1955", "1958"], "ans": 0, "exp": "Pakistan's first cabinet was formed in 1947, immediately following independence."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The Objectives Resolution debate in the Constituent Assembly took place in:", "opts": ["1947", "1949", "1950", "1952"], "ans": 1, "exp": "The Objectives Resolution was debated and passed in March 1949."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The Basic Principles Committee, tasked with framing Pakistan's constitution, presented its first report in:", "opts": ["1949", "1950", "1952", "1954"], "ans": 1, "exp": "The Basic Principles Committee presented its first report in 1950."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The dismissal of Pakistan's first Constituent Assembly by Governor-General Ghulam Muhammad occurred in:", "opts": ["1951", "1953", "1954", "1956"], "ans": 2, "exp": "The first Constituent Assembly was dismissed in October 1954."}, {"section": "International Relations / Current Affairs", "q": "The Congress of Vienna, reorganizing Europe after the Napoleonic Wars, was held in:", "opts": ["1789", "1804", "1815", "1830"], "ans": 2, "exp": "The Congress of Vienna was held in 1814-1815."}, {"section": "International Relations / Current Affairs", "q": "The unification of Italy was largely completed by:", "opts": ["1848", "1861", "1871", "1900"], "ans": 1, "exp": "Italian unification was largely completed in 1861, with the Kingdom of Italy proclaimed that year."}, {"section": "International Relations / Current Affairs", "q": "The Spanish-American War, leading to US acquisition of territories, occurred in:", "opts": ["1890", "1898", "1905", "1912"], "ans": 1, "exp": "The Spanish-American War occurred in 1898."}, {"section": "International Relations / Current Affairs", "q": "The Treaty of Sevres, dealing with the Ottoman Empire's dissolution, was signed in:", "opts": ["1918", "1920", "1923", "1925"], "ans": 1, "exp": "The Treaty of Sevres was signed in 1920, though later replaced by the Treaty of Lausanne (1923)."}, {"section": "International Relations / Current Affairs", "q": "The Treaty of Lausanne, establishing modern Turkey's borders, was signed in:", "opts": ["1920", "1923", "1925", "1930"], "ans": 1, "exp": "The Treaty of Lausanne was signed in 1923."}, {"section": "International Relations / Current Affairs", "q": "The Munich Agreement, a key pre-WWII appeasement event, was signed in:", "opts": ["1935", "1936", "1938", "1939"], "ans": 2, "exp": "The Munich Agreement was signed in September 1938."}, {"section": "International Relations / Current Affairs", "q": "The Molotov-Ribbentrop Pact between Nazi Germany and the Soviet Union was signed in:", "opts": ["1937", "1938", "1939", "1940"], "ans": 2, "exp": "The Molotov-Ribbentrop Pact was signed in August 1939."}, {"section": "International Relations / Current Affairs", "q": "The Yalta Conference, planning the post-WWII world order, was held in:", "opts": ["1943", "1944", "1945", "1946"], "ans": 2, "exp": "The Yalta Conference was held in February 1945."}, {"section": "International Relations / Current Affairs", "q": "The Potsdam Conference, dealing with post-WWII Germany, was held in:", "opts": ["1944", "1945", "1946", "1947"], "ans": 1, "exp": "The Potsdam Conference was held in July-August 1945."}, {"section": "International Relations / Current Affairs", "q": "The founding of NATO's rival, the Warsaw Pact, directly followed West Germany's admission to NATO in:", "opts": ["1952", "1954", "1955", "1957"], "ans": 2, "exp": "West Germany joined NATO in 1955, prompting the Warsaw Pact's formation the same year."}, {"section": "Islamic Studies (Dates & Events)", "q": "The Battle of Tabuk, the Prophet's (PBUH) last military expedition, took place in which Hijri year?", "opts": ["7 A.H.", "8 A.H.", "9 A.H.", "10 A.H."], "ans": 2, "exp": "The Battle of Tabuk took place in 9 A.H. (630 CE)."}, {"section": "Islamic Studies (Dates & Events)", "q": "The delegation year (Aam-ul-Wufood), when many tribes sent delegations to accept Islam, is dated to:", "opts": ["7 A.H.", "8 A.H.", "9 A.H.", "10 A.H."], "ans": 2, "exp": "The 'Year of Delegations' is dated to 9 A.H. (630-631 CE)."}, {"section": "Islamic Studies (Dates & Events)", "q": "The event of the 'Splitting of the Moon' (Shaqq al-Qamar), a reported miracle, is traditionally dated to before Hijrah, around:", "opts": ["605 CE", "615 CE", "620 CE", "622 CE"], "ans": 2, "exp": "The Splitting of the Moon is traditionally dated to around 620 CE, before the Hijrah."}, {"section": "Islamic Studies (Dates & Events)", "q": "The construction of the Prophet's Mosque (Masjid an-Nabawi) in Madinah began shortly after:", "opts": ["The Battle of Badr", "The Hijrah (622 CE)", "The Conquest of Makkah", "The Farewell Pilgrimage"], "ans": 1, "exp": "Construction of the Prophet's Mosque began shortly after the Hijrah in 622 CE."}, {"section": "Islamic Studies (Dates & Events)", "q": "The event of 'Bai'at-e-Ridwan' (Pledge under the Tree) occurred in which Hijri year?", "opts": ["5 A.H.", "6 A.H.", "7 A.H.", "8 A.H."], "ans": 1, "exp": "Bai'at-e-Ridwan occurred in 6 A.H. (628 CE), at Hudaybiyyah."}, {"section": "Islamic Studies (Dates & Events)", "q": "The migration of Hazrat Umar (RA) to Madinah, notably done openly, occurred around:", "opts": ["620 CE", "621 CE", "622 CE", "624 CE"], "ans": 2, "exp": "Hazrat Umar's migration to Madinah occurred in 622 CE, around the same time as the Hijrah."}, {"section": "Islamic Studies (Dates & Events)", "q": "The expedition of Mu'tah, an early encounter with Byzantine forces, took place in which Hijri year?", "opts": ["6 A.H.", "7 A.H.", "8 A.H.", "9 A.H."], "ans": 2, "exp": "The Battle of Mu'tah took place in 8 A.H. (629 CE)."}, {"section": "Islamic Studies (Dates & Events)", "q": "The construction of the Dome of the Rock in Jerusalem was completed in:", "opts": ["661 CE", "691 CE", "705 CE", "750 CE"], "ans": 1, "exp": "The Dome of the Rock was completed in 691 CE under Umayyad Caliph Abd al-Malik."}, {"section": "English", "q": "'Necessity is the mother of invention' means:", "opts": ["Mothers are inventive", "Difficult situations/needs often lead to creative solutions", "Invention requires funding", "Necessity is overrated"], "ans": 1, "exp": "This proverb means that urgent needs or difficult circumstances often drive innovative solutions."}, {"section": "English", "q": "'All that glitters is not gold' means:", "opts": ["Gold always shines", "Appearances can be deceiving; not everything attractive is valuable", "Jewelry is overpriced", "Shiny objects are rare"], "ans": 1, "exp": "This proverb warns that something may appear valuable or good on the surface but not actually be so."}, {"section": "English", "q": "Choose the word closest in meaning to 'Debacle':", "opts": ["A triumph", "A sudden, humiliating failure or disaster", "A celebration", "A minor setback"], "ans": 1, "exp": "'Debacle' means a sudden and humiliating failure; a fiasco."}, {"section": "English", "q": "Choose the correctly spelled word:", "opts": ["Jeopardy", "Jeapordy", "Jeopardi", "Jeoperdy"], "ans": 0, "exp": "The correct spelling is 'Jeopardy'."}, {"section": "General Science & Ability", "q": "If a sum of Rs. 20,000 is invested at 8% compound interest for 2 years, find the compound interest.", "opts": ["Rs. 3,200", "Rs. 3,328", "Rs. 3,400", "Rs. 3,500"], "ans": 1, "exp": "CI=20000[(1.08)²−1]=20000×0.1664=Rs. 3,328."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The Muslim League's Karachi session, where significant resolutions on Pakistan's economic policy were discussed, was held in:", "opts": ["1938", "1943", "1948", "1950"], "ans": 2, "exp": "The Muslim League held a significant session in Karachi in 1948 after independence."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The death of Liaquat Ali Khan led to Khawaja Nazimuddin becoming Prime Minister in:", "opts": ["1950", "1951", "1953", "1955"], "ans": 1, "exp": "Khawaja Nazimuddin became Prime Minister in October 1951, following Liaquat Ali Khan's assassination."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "Muhammad Ali Bogra became Prime Minister of Pakistan in:", "opts": ["1951", "1953", "1955", "1957"], "ans": 1, "exp": "Muhammad Ali Bogra became Prime Minister in 1953."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The Bogra Formula, a proposed constitutional framework, was presented in:", "opts": ["1950", "1953", "1956", "1958"], "ans": 1, "exp": "The Bogra Formula was presented in 1953, proposing a bicameral legislature."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "Chaudhry Muhammad Ali became Prime Minister of Pakistan, overseeing the 1956 Constitution, in:", "opts": ["1953", "1955", "1956", "1958"], "ans": 1, "exp": "Chaudhry Muhammad Ali became Prime Minister in 1955."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "Pakistan's first general elections, which were never completed due to the 1958 coup, had been scheduled for:", "opts": ["1958", "1959", "1960", "1962"], "ans": 1, "exp": "General elections had been scheduled for early 1959 before Ayub Khan's coup intervened."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The Indus Waters Treaty between Pakistan and India was signed in:", "opts": ["1956", "1958", "1960", "1962"], "ans": 2, "exp": "The Indus Waters Treaty was signed in September 1960, brokered by the World Bank."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The construction of Mangla Dam, part of the Indus Basin Project, began in:", "opts": ["1961", "1963", "1967", "1970"], "ans": 0, "exp": "Construction of Mangla Dam began in 1961 and was completed in 1967."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The construction of Tarbela Dam began in:", "opts": ["1968", "1970", "1974", "1976"], "ans": 1, "exp": "Construction of Tarbela Dam began in 1968 and was completed in 1976."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "Pakistan's Second Five-Year Plan, part of its economic planning efforts, covered the period:", "opts": ["1955-1960", "1960-1965", "1965-1970", "1970-1975"], "ans": 1, "exp": "Pakistan's Second Five-Year Plan covered 1960-1965."}, {"section": "International Relations / Current Affairs", "q": "The Marshall Plan, aiding post-WWII European recovery, was launched in:", "opts": ["1945", "1947", "1949", "1952"], "ans": 1, "exp": "The Marshall Plan was launched in 1947."}, {"section": "International Relations / Current Affairs", "q": "The Berlin Airlift, a major Cold War event, occurred in:", "opts": ["1945-1946", "1948-1949", "1950-1951", "1953-1954"], "ans": 1, "exp": "The Berlin Airlift occurred from 1948-1949, in response to the Soviet blockade of West Berlin."}, {"section": "International Relations / Current Affairs", "q": "The Bay of Pigs invasion, a failed US-backed operation against Cuba, occurred in:", "opts": ["1959", "1961", "1963", "1965"], "ans": 1, "exp": "The Bay of Pigs invasion occurred in April 1961."}, {"section": "International Relations / Current Affairs", "q": "The assassination of US President John F. Kennedy occurred in:", "opts": ["1961", "1963", "1965", "1968"], "ans": 1, "exp": "President Kennedy was assassinated on 22 November 1963."}, {"section": "International Relations / Current Affairs", "q": "The Camp David Accords were followed by the Egypt-Israel Peace Treaty, signed in:", "opts": ["1977", "1978", "1979", "1981"], "ans": 2, "exp": "The Egypt-Israel Peace Treaty was signed in March 1979."}, {"section": "International Relations / Current Affairs", "q": "The founding of the Palestine Liberation Organization (PLO) occurred in:", "opts": ["1948", "1959", "1964", "1970"], "ans": 2, "exp": "The PLO was founded in 1964."}, {"section": "International Relations / Current Affairs", "q": "The Iranian Revolution, overthrowing the Shah, occurred in:", "opts": ["1975", "1977", "1979", "1981"], "ans": 2, "exp": "The Iranian Revolution occurred in 1979."}, {"section": "International Relations / Current Affairs", "q": "The US hostage crisis in Iran began in:", "opts": ["1977", "1979", "1981", "1983"], "ans": 1, "exp": "The Iran hostage crisis began in November 1979."}, {"section": "International Relations / Current Affairs", "q": "The founding of the European Coal and Steel Community, a precursor to the EU, occurred in:", "opts": ["1948", "1950", "1952", "1957"], "ans": 2, "exp": "The European Coal and Steel Community was established in 1952 (treaty signed 1951)."}, {"section": "International Relations / Current Affairs", "q": "The fall of Saigon, marking the end of the Vietnam War, occurred in:", "opts": ["1973", "1975", "1977", "1979"], "ans": 1, "exp": "Saigon fell in April 1975, marking the end of the Vietnam War."}, {"section": "Islamic Studies (Dates & Events)", "q": "The establishment of the Fatimid Caliphate in North Africa occurred in:", "opts": ["850 CE", "909 CE", "950 CE", "1000 CE"], "ans": 1, "exp": "The Fatimid Caliphate was established in 909 CE."}, {"section": "Islamic Studies (Dates & Events)", "q": "The founding of Al-Azhar University, one of the oldest universities in the world, occurred in:", "opts": ["859 CE", "970 CE", "1000 CE", "1100 CE"], "ans": 1, "exp": "Al-Azhar was founded around 970 CE by the Fatimids."}, {"section": "Islamic Studies (Dates & Events)", "q": "The establishment of the Seljuk Empire occurred around:", "opts": ["900 CE", "1037 CE", "1100 CE", "1200 CE"], "ans": 1, "exp": "The Seljuk Empire was established around 1 const SECTIONS = [...new Set(QUESTIONS.map(q=>q.section))];
let state = {
  section: 'All',
  pool: [],
  idx: 0,
  answered: {},
  score: 0
};

function buildPool(section){
  const list = section === 'All' ? QUESTIONS : QUESTIONS.filter(q=>q.section===section);
  return list.map((q,i)=>({...q, poolIndex:i}));
}

function startQuiz(section){
  state.section = section;
  state.pool = buildPool(section);
  state.idx = 0;
  state.answered = {};
  state.score = 0;
  renderQuestion();
}

function renderStart(){
  const app = document.getElementById('app');
  let chips = SECTIONS.map(s=>`<div class="chip" data-sec="${s}">${s} (${QUESTIONS.filter(q=>q.section===s).length})</div>`).join('');
  app.innerHTML = `
    <div class="card start-screen">
      <p>Choose a section to focus on, or take the full mixed quiz. Each question shows a short explanation right after you answer.</p>
      <div class="section-picker">
        <div class="chip active" data-sec="All">All Sections (${QUESTIONS.length})</div>
        ${chips}
      </div>
      <div class="nav-row">
        <button class="nav" id="beginBtn">Start Quiz</button>
      </div>
    </div>`;
  let chosen = 'All';
  document.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click', ()=>{
      document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      c.classList.add('active');
      chosen = c.dataset.sec;
    });
  });
  document.getElementById('beginBtn').addEventListener('click', ()=> startQuiz(chosen));
}

function renderQuestion(){
  const app = document.getElementById('app');
  const total = state.pool.length;
  const q = state.pool[state.idx];
  const pct = Math.round((state.idx/total)*100);
  const already = state.answered[state.idx];

  const optsHtml = q.opts.map((opt,i)=>{
    let cls = 'opt';
    let disabledAttr = '';
    if(already !== undefined){
      disabledAttr = 'disabled';
      if(i === q.ans) cls += ' correct';
      else if(i === already) cls += ' wrong';
    }
    return `<button class="${cls}" data-i="${i}" ${disabledAttr}>${String.fromCharCode(65+i)}. ${opt}</button>`;
  }).join('');

  const explainHtml = already !== undefined ? `<div class="explain"><b>${already===q.ans?'Correct. ':'Not quite. '}</b>${q.exp}</div>` : '';

  app.innerHTML = `
    <div class="progress-row">
      <span>Question ${state.idx+1} / ${total}</span>
      <span>Score: ${state.score}</span>
    </div>
    <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="qtag">${q.section}</div>
      <div class="qtext">${q.q}</div>
      ${optsHtml}
      ${explainHtml}
      <div class="nav-row">
        <button class="nav secondary" id="prevBtn" ${state.idx===0?'disabled':''}>Previous</button>
        <button class="nav" id="nextBtn" ${already===undefined?'disabled':''}>${state.idx===total-1?'Finish':'Next'}</button>
      </div>
    </div>`;

  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(state.answered[state.idx] !== undefined) return;
      const i = parseInt(btn.dataset.i);
      state.answered[state.idx] = i;
      if(i === q.ans) state.score++;
      renderQuestion();
    });
  });
  document.getElementById('prevBtn').addEventListener('click', ()=>{
    if(state.idx>0){ state.idx--; renderQuestion(); }
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(state.idx < total-1){ state.idx++; renderQuestion(); }
    else renderScore();
  });
}

function renderScore(){
  const app = document.getElementById('app');
  const total = state.pool.length;
  const pct = Math.round((state.score/total)*100);
  app.innerHTML = `
    <div class="card score-screen">
      <div class="qtag">${state.section}</div>
      <div>You scored</div>
      <div class="score-num">${state.score} / ${total}</div>
      <div class="sub">${pct}% correct</div>
      <div class="nav-row">
        <button class="nav secondary" id="retryBtn">Retry Section</button>
        <button class="nav" id="homeBtn">Choose Another Section</button>
      </div>
    </div>`;
  document.getElementById('retryBtn').addEventListener('click', ()=> startQuiz(state.section));
  document.getElementById('homeBtn').addEventListener('click', renderStart);
}

renderStart();
</script>
